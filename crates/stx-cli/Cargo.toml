[package]
name = "stx-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "stx CLI: live tip data, the AI fault-injection demo, and (with credentials) live bundle submission."

[[bin]]
name = "stx"
path = "src/main.rs"

[dependencies]
stx-core = { path = "../stx-core" }
stx-jito = { path = "../stx-jito" }
stx-agent = { path = "../stx-agent" }
stx-ingestor = { path = "../stx-ingestor" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
chrono.workspace = true
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "rustls-tls"] }
anyhow = "1"
dotenvy = "0.15"
solana-sdk = "4.0.1"
async-trait = "0.1"
