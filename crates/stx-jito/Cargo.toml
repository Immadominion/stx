[package]
name = "stx-jito"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Jito integration: dynamic tip engine, bundle builder, multi-region submitter, bundle-result tracking, and RPC helpers (via raw JSON-RPC)."

[dependencies]
async-trait = "0.1.89"
base64 = "0.22.1"
chrono.workspace = true
futures = "0.3"
bs58 = "0.5.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "rustls-tls"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
solana-sdk = "4.0.1"
solana-transaction = { version = "4.1.2", features = ["serde"] }
solana-system-interface = { version = "3.2.0", features = ["bincode"] }
bincode = "1.3"
stx-core = { path = "../stx-core" }
thiserror.workspace = true
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1.44"
