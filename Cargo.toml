[workspace]
resolver = "2"
members = [
    "crates/stx-core",
    "crates/stx-jito",
    "crates/stx-ingestor",
    "crates/stx-agent",
    "crates/stx-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Immadominion/stx"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
opt-level = 3
lto = "thin"
